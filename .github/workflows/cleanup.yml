name: Cleanup AWS Resources

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      environment:
        description: 'Environment to clean up (dev, staging, prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}  # Use input or default to staging

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Run cleanup script
        run: |
          echo "Running cleanup script for environment: $ENVIRONMENT"
          chmod +x ./scripts/cleanup_staging_resources.sh
          ./scripts/cleanup_staging_resources.sh
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
