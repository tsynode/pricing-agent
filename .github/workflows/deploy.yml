name: Deploy AI Pricing Compliance System

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region to deploy to'
        required: true
        default: 'us-east-1'
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - eu-west-1
          - eu-central-1

env:
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  TERRAFORM_VERSION: 1.5.7

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: "Step 1: Temporarily Disable Backend for Bootstrap"
        working-directory: ./infrastructure
        run: |
          # Create a backup of the backend.tf file
          cp backend.tf backend.tf.bak
          
          # Create a temporary file with backend disabled
          cat > backend.tf << 'EOF'
          # S3 Backend Configuration - Temporarily disabled for bootstrap
          terraform {
            # Backend configuration is commented out during initial setup
            # backend "s3" {}
          }
          EOF
      
      - name: "Step 2: Initialize Terraform with Local Backend"
        working-directory: ./infrastructure
        run: terraform init
      
      - name: "Step 3: Create S3 Bucket and DynamoDB Table for State Management"
        working-directory: ./infrastructure
        run: |
          # Create a temporary directory for state resources only
          mkdir -p ../temp_state
          cp terraform-state.tf ../temp_state/
          cp variables.tf ../temp_state/
          
          # Create a minimal main.tf file with the random_string resource
          cat > ../temp_state/main.tf << 'EOF'
          provider "aws" {
            region = var.aws_region
          }
          
          # Random string for unique resource naming
          resource "random_string" "suffix" {
            length  = 8
            special = false
            upper   = false
          }
          
          locals {
            name_prefix = "${var.project_name}-${var.environment}"
            common_tags = {
              Project     = var.project_name
              Environment = var.environment
              ManagedBy   = "Terraform"
            }
          }
          EOF
          
          # Initialize and apply in the temporary directory
          cd ../temp_state
          terraform init
          terraform apply -auto-approve
          
          # Get the bucket and table names and set them as environment variables
          echo "TF_BUCKET_NAME=$(terraform output -raw terraform_state_bucket)" >> $GITHUB_ENV
          echo "TF_DYNAMODB_TABLE=$(terraform output -raw terraform_locks_table)" >> $GITHUB_ENV
          
          # Print the values for debugging
          echo "Using S3 bucket: $(terraform output -raw terraform_state_bucket)"
          echo "Using DynamoDB table: $(terraform output -raw terraform_locks_table)"
          
          # Clean up
          cd ../infrastructure
      
      - name: "Step 4: Restore S3 Backend Configuration"
        working-directory: ./infrastructure
        run: |
          # Restore the original backend.tf file
          mv backend.tf.bak backend.tf
      
      - name: "Step 5: Initialize Terraform with S3 Backend"
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using DynamoDB table: $TF_DYNAMODB_TABLE"
          echo "Using AWS region: $AWS_REGION"
          
          # Initialize with S3 backend
          terraform init -force-copy \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_DYNAMODB_TABLE"

      - name: "Step 6: Validate Terraform Configuration"
        working-directory: ./infrastructure
        run: terraform validate

      - name: "Step 7: Generate Terraform Plan"
        working-directory: ./infrastructure
        run: terraform plan -out=tfplan

      - name: "Step 8: Apply Terraform Changes"
        working-directory: ./infrastructure
        run: terraform apply -auto-approve tfplan

      - name: Get ECR Repository URL
        id: ecr
        run: |
          ECR_REPO_URL=$(terraform -chdir=./infrastructure output -raw ecr_repository_url)
          echo "repo_url=${ECR_REPO_URL}" >> $GITHUB_OUTPUT

      - name: Package Lambda Functions
        run: |
          # Create deployment packages for Lambda functions
          mkdir -p ./build/lambdas
          
          # Inventory Scanner Lambda
          cd ./src/lambdas/inventory_scanner
          pip install -r requirements.txt -t ./package
          cp lambda_function.py ./package/
          cd ./package
          zip -r ../../../../../../../build/lambdas/inventory_scanner.zip .
          cd ../../../
          
          # Batch Processor Lambda
          cd ./batch_processor
          pip install -r requirements.txt -t ./package
          cp lambda_function.py ./package/
          cd ./package
          zip -r ../../../../../../../build/lambdas/batch_processor.zip .
          cd ../../../
          
          # Pricing Tools Lambda
          cd ./pricing_tools
          pip install -r requirements.txt -t ./package
          cp lambda_function.py ./package/
          cd ./package
          zip -r ../../../../../../../build/lambdas/pricing_tools.zip .
          cd ../../../

      - name: Update Lambda Functions
        run: |
          # Update Lambda functions with new code
          aws lambda update-function-code \
            --function-name $(terraform -chdir=./infrastructure output -raw inventory_scanner_lambda_name) \
            --zip-file fileb://build/lambdas/inventory_scanner.zip
            
          aws lambda update-function-code \
            --function-name $(terraform -chdir=./infrastructure output -raw batch_processor_lambda_name) \
            --zip-file fileb://build/lambdas/batch_processor.zip
            
          aws lambda update-function-code \
            --function-name $(terraform -chdir=./infrastructure output -raw pricing_tools_lambda_name) \
            --zip-file fileb://build/lambdas/pricing_tools.zip

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Streamlit Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/streamlit
          push: true
          tags: ${{ steps.ecr.outputs.repo_url }}:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $(terraform -chdir=./infrastructure output -raw ecs_cluster_name) \
            --service $(terraform -chdir=./infrastructure output -raw ecs_service_name) \
            --force-new-deployment

      - name: Output Deployment Information
        run: |
          echo "Deployment completed successfully!"
          echo "Application URL: http://$(terraform -chdir=./infrastructure output -raw alb_dns_name)"
