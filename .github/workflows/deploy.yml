name: Deploy Pricing Agent

on:
  push:
    branches: [main]
    paths-ignore:
      - 'policies/**'  # Policies have their own workflow
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init
      
      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: ./infrastructure
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Build and push Docker image
        run: |
          # Get ECR repository URI from Terraform output
          ECR_REPO_URI=$(cd infrastructure && terraform output -raw ecr_repository_url)
          
          # Login to ECR
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REPO_URI
          
          # Build and push Docker image
          docker build -t $ECR_REPO_URI:latest .
          docker push $ECR_REPO_URI:latest
      
      - name: Update ECS service
        run: |
          # Get cluster and service names from Terraform output
          CLUSTER_NAME=$(cd infrastructure && terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(cd infrastructure && terraform output -raw ecs_service_name)
          
          # Force new deployment
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
      
      - name: Output application URL
        run: |
          echo "Application deployed successfully!"
          echo "URL: $(cd infrastructure && terraform output -raw alb_dns_name)"
