name: Deploy Pricing Agent

on:
  push:
    branches: [main]
    paths-ignore:
      - 'policies/**'  # Policies have their own workflow
  workflow_dispatch:  # Allow manual triggering

env:
  ENVIRONMENT: dev  # Default environment, can be overridden in repository secrets

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Create S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Create S3 bucket for Terraform state if it doesn't exist
          aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null || \
          aws s3api create-bucket \
            --bucket $BUCKET_NAME \
            --region ${{ secrets.AWS_REGION }} \
            $([[ "${{ secrets.AWS_REGION }}" == "us-east-1" ]] || echo "--create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}")
          
          # Enable versioning on the bucket
          aws s3api put-bucket-versioning \
            --bucket $BUCKET_NAME \
            --versioning-configuration Status=Enabled
          
          # Block public access to the bucket
          aws s3api put-public-access-block \
            --bucket $BUCKET_NAME \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          # Enable encryption on the bucket
          aws s3api put-bucket-encryption \
            --bucket $BUCKET_NAME \
            --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          
          # Initialize with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent-${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      
      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Import or Create ECR Repository
        working-directory: ./infrastructure
        run: |
          # Check if ECR repository already exists
          REPO_NAME="pricing-agent-${ENVIRONMENT}"
          echo "Checking if ECR repository $REPO_NAME already exists..."
          
          # Try to describe the repository
          aws ecr describe-repositories --repository-names $REPO_NAME &> /dev/null
          
          if [ $? -eq 0 ]; then
            echo "ECR repository already exists. Importing into Terraform state..."
            terraform import aws_ecr_repository.main $REPO_NAME || {
              echo "Failed to import ECR repository. This is not critical, continuing..."
            }
          else
            echo "ECR repository does not exist. Creating it..."
            terraform apply -auto-approve -target=aws_ecr_repository.main
          fi
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Set ECR Repository URL
        id: set-ecr-repo
        run: |
          # Get account ID for constructing ECR repository URL
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${AWS_REGION}
          
          # Construct the ECR URL manually
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/pricing-agent-${ENVIRONMENT}"
          
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "Constructed ECR repository URL: $ECR_REPO_URI"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
      

      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-ecr-repo.outputs.ecr_repo_uri }}:latest
          no-cache: true
      
      - name: Terraform Apply Infrastructure
        working-directory: ./infrastructure
        run: |
          # First apply the core components
          echo "\n🔧 Applying core components...\n"
          
          echo "Applying DynamoDB tables..."
          terraform import aws_dynamodb_table.inventory pricing-agent-${ENVIRONMENT}-inventory || echo "Import failed, will try to create"
          terraform import aws_dynamodb_table.pricing pricing-agent-${ENVIRONMENT}-pricing-rules || echo "Import failed, will try to create"
          terraform apply -auto-approve -target=aws_dynamodb_table.inventory -target=aws_dynamodb_table.pricing || true
          
          echo "Applying S3 buckets..."
          # Try to get bucket names first
          POLICY_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'pricing-agent-${ENVIRONMENT}-policies')].Name" --output text)
          SESSION_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'pricing-agent-${ENVIRONMENT}-sessions')].Name" --output text)
          
          if [[ -n "$POLICY_BUCKET" ]]; then
            echo "Importing policy bucket: $POLICY_BUCKET"
            terraform import aws_s3_bucket.policy $POLICY_BUCKET || echo "Import failed, will try to create"
          fi
          
          if [[ -n "$SESSION_BUCKET" ]]; then
            echo "Importing session bucket: $SESSION_BUCKET"
            terraform import aws_s3_bucket.session $SESSION_BUCKET || echo "Import failed, will try to create"
          fi
          
          terraform apply -auto-approve -target=aws_s3_bucket.policy -target=aws_s3_bucket.session || true
          
          echo "Applying S3 bucket policies..."
          terraform apply -auto-approve -target=aws_s3_bucket_policy.policy -target=aws_s3_bucket_policy.session || true
          
          echo "Applying SSM parameters..."
          terraform import aws_ssm_parameter.kb_id /pricing-agent-${ENVIRONMENT}/knowledge-base-id || echo "Import failed, will try to create"
          terraform import aws_ssm_parameter.policy_bucket_name /pricing-agent-${ENVIRONMENT}/policy-bucket-name || echo "Import failed, will try to create"
          terraform import aws_ssm_parameter.session_bucket_name /pricing-agent-${ENVIRONMENT}/session-bucket-name || echo "Import failed, will try to create"
          terraform apply -auto-approve -target=aws_ssm_parameter.kb_id -target=aws_ssm_parameter.policy_bucket_name -target=aws_ssm_parameter.session_bucket_name || true
          
          echo "Applying IAM roles and policies..."
          # Get account ID for IAM ARNs
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Try to import IAM roles and policies
          terraform import aws_iam_role.ecs_task pricing-agent-${ENVIRONMENT}-ecs-task-role || echo "Import failed, will try to create"
          terraform import aws_iam_role.ecs_execution pricing-agent-${ENVIRONMENT}-ecs-execution-role || echo "Import failed, will try to create"
          terraform import aws_iam_policy.ecs_task_policy arn:aws:iam::$ACCOUNT_ID:policy/pricing-agent-${ENVIRONMENT}-ecs-task-policy || echo "Import failed, will try to create"
          terraform import aws_iam_policy.ecs_execution_policy arn:aws:iam::$ACCOUNT_ID:policy/pricing-agent-${ENVIRONMENT}-ecs-execution-policy || echo "Import failed, will try to create"
          
          terraform apply -auto-approve -target=aws_iam_role.ecs_task -target=aws_iam_role.ecs_execution || true
          terraform apply -auto-approve -target=aws_iam_policy.ecs_task_policy -target=aws_iam_policy.ecs_execution_policy || true
          terraform apply -auto-approve -target=aws_iam_role_policy_attachment.ecs_task -target=aws_iam_role_policy_attachment.ecs_execution || true
          
          echo "Applying DynamoDB table items..."
          terraform apply -auto-approve -target=aws_dynamodb_table_item.sample_inventory -target=aws_dynamodb_table_item.sample_pricing || true
          
          # Now apply the networking components
          echo "\n🌐 Applying networking components...\n"
          
          echo "Checking for existing VPC..."
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-vpc" --query "Vpcs[0].VpcId" --output text)
          
          if [[ "$VPC_ID" != "None" && -n "$VPC_ID" ]]; then
            echo "Importing VPC: $VPC_ID"
            terraform import aws_vpc.main $VPC_ID || echo "Import failed, will try to create"
          fi
          
          echo "Applying VPC and subnets..."
          terraform apply -auto-approve -target=aws_vpc.main || true
          
          # Get VPC ID again in case it was just created
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-vpc" --query "Vpcs[0].VpcId" --output text)
          
          if [[ "$VPC_ID" != "None" && -n "$VPC_ID" ]]; then
            echo "Applying subnets for VPC: $VPC_ID"
            terraform apply -auto-approve -target=aws_subnet.public -target=aws_subnet.private || true
            
            echo "Applying internet gateway and NAT gateway..."
            terraform apply -auto-approve -target=aws_internet_gateway.main -target=aws_eip.nat -target=aws_nat_gateway.main || true
            
            echo "Applying route tables..."
            terraform apply -auto-approve -target=aws_route_table.public -target=aws_route_table.private -target=aws_route_table_association.public -target=aws_route_table_association.private || true
            
            echo "Applying security groups..."
            terraform apply -auto-approve -target=aws_security_group.alb -target=aws_security_group.ecs || true
            
            echo "Applying load balancer..."
            terraform apply -auto-approve -target=aws_lb.main -target=aws_lb_target_group.main -target=aws_lb_listener.http || true
          else
            echo "VPC creation failed. Cannot continue with networking components."
          fi
          
          # Finally apply the compute components
          echo "\n🖥️ Applying compute components...\n"
          
          echo "Applying ECS cluster..."
          terraform apply -auto-approve -target=aws_ecs_cluster.main || true
          
          echo "Applying ECS task definition..."
          terraform apply -auto-approve -target=aws_ecs_task_definition.main || true
          
          echo "Applying ECS service..."
          terraform apply -auto-approve -target=aws_ecs_service.main || true
          
          echo "\n✅ Infrastructure deployment complete!\n"
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Debug and Create ECS Service
        run: |
          echo "\n🚀 Debugging ECS service...\n"
          
          # Get the ECS cluster and service names
          CLUSTER_NAME="pricing-agent-${ENVIRONMENT}-cluster"
          SERVICE_NAME="pricing-agent-${ENVIRONMENT}-service"
          
          # Check if the cluster exists
          echo "Checking if ECS cluster exists..."
          aws ecs describe-clusters --clusters $CLUSTER_NAME --query "clusters[?status=='ACTIVE']" --output text
          
          # Check if the task definition exists
          echo "\nChecking task definition..."
          TASK_DEF="pricing-agent-${ENVIRONMENT}"
          aws ecs describe-task-definition --task-definition $TASK_DEF || echo "Task definition not found"
          
          # Check if the service exists
          echo "\nChecking if ECS service exists..."
          aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME || echo "Service not found"
          
          # Check security groups and subnets
          echo "\nChecking security groups..."
          SG_NAME="pricing-agent-${ENVIRONMENT}-ecs-sg"
          aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" || echo "Security group not found"
          
          echo "\nChecking subnets..."
          aws ec2 describe-subnets --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" || echo "Subnets not found"
          
          # Try to create the service if it doesn't exist
          echo "\nAttempting to create ECS service..."
          cd infrastructure
          
          # Apply just the ECS service
          echo "Applying ECS service resource..."
          terraform apply -auto-approve -target=aws_ecs_service.main || {
            echo "\n⚠️ Failed to create ECS service through Terraform.\n"
            
            # Get task definition ARN
            TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition $TASK_DEF --query "taskDefinition.taskDefinitionArn" --output text)
            
            # Get security group ID
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" --query "SecurityGroups[0].GroupId" --output text)
            
            # Get subnet IDs
            SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            
            # Get target group ARN
            TG_NAME="pricing-agent-${ENVIRONMENT}-tg"
            TG_ARN=$(aws elbv2 describe-target-groups --names $TG_NAME --query "TargetGroups[0].TargetGroupArn" --output text)
            
            echo "Creating ECS service using AWS CLI..."
            aws ecs create-service \
              --cluster $CLUSTER_NAME \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=app,containerPort=8501" || echo "Failed to create service using AWS CLI"
          }
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
      
      - name: Output Deployment Information
        run: |
          echo "\n🎉 PRICING AGENT DEPLOYMENT COMPLETE 🎉\n"
          echo "All components have been successfully deployed to AWS.\n"
          
          # Get important outputs from Terraform
          cd infrastructure
          
          # Get ALB DNS name
          ALB_DNS=$(terraform output alb_dns_name 2>/dev/null | tr -d '"' || echo "Not available")
          
          # Get ECR repository URL
          ECR_REPO=$(terraform output ecr_repository_url 2>/dev/null | tr -d '"' || echo "Not available")
          
          # Get S3 bucket names
          POLICY_BUCKET=$(terraform output policy_bucket_name 2>/dev/null | tr -d '"' || echo "Not available")
          SESSION_BUCKET=$(terraform output session_bucket_name 2>/dev/null | tr -d '"' || echo "Not available")
          
          # Get DynamoDB table names
          INVENTORY_TABLE=$(terraform output inventory_table_name 2>/dev/null | tr -d '"' || echo "Not available")
          PRICING_TABLE=$(terraform output pricing_table_name 2>/dev/null | tr -d '"' || echo "Not available")
          
          # Get ECS cluster and service names
          ECS_CLUSTER=$(terraform output ecs_cluster_name 2>/dev/null | tr -d '"' || echo "Not available")
          # For ECS service, we know the naming convention even if the output isn't available
          ECS_SERVICE=$(terraform output ecs_service_name 2>/dev/null | tr -d '"' || echo "pricing-agent-${ENVIRONMENT}-service")
          
          # Print deployment summary
          echo "\n💻 APPLICATION ACCESS\n"
          echo "Access your Pricing Agent at: http://$ALB_DNS"
          echo "(It may take a few minutes for the application to become available)"
          
          echo "\n💾 RESOURCE INFORMATION\n"
          echo "Docker Image: $ECR_REPO:latest"
          echo "ECS Cluster: $ECS_CLUSTER"
          echo "ECS Service: $ECS_SERVICE"
          echo "Load Balancer: $ALB_DNS"
          
          echo "\n📂 DATA STORAGE\n"
          echo "Policy Bucket: $POLICY_BUCKET"
          echo "Session Bucket: $SESSION_BUCKET"
          echo "Inventory Table: $INVENTORY_TABLE"
          echo "Pricing Rules Table: $PRICING_TABLE"
          
          echo "\n💡 NEXT STEPS\n"
          echo "1. Configure the Bedrock knowledge base separately"
          echo "2. Update the SSM parameter with the actual knowledge base ID"
          echo "3. Use the knowledge base sync script to populate the knowledge base"
          
          echo "\n📌 DEPLOYMENT DETAILS\n"
          echo "Environment: ${ENVIRONMENT}"
          echo "Region: ${AWS_REGION}"
          echo "Deployment Time: $(date)"
          
          echo "\n👍 DEPLOYMENT SUCCESSFUL!\n"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
