name: Deploy Pricing Agent

on:
  push:
    branches: [main]
    paths-ignore:
      - 'policies/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      model_id:
        description: 'AI model to use'
        required: true
        default: 'anthropic.claude-3-7-sonnet-20250219-v1:0'
        type: choice
        options:
          - anthropic.claude-opus-4-20250514-v1:0
          - anthropic.claude-sonnet-4-20250514-v1:0
          - anthropic.claude-3-7-sonnet-20250219-v1:0
      domain_name:
        description: 'Domain name for the application (e.g., pricing-agent.example.com)'
        required: false
        type: string
      enable_https:
        description: 'Enable HTTPS for the ALB'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      inference_profile_arn:
        description: 'ARN of the Bedrock inference profile (optional)'
        required: false
        type: string

env:
  ENVIRONMENT: 'staging'
  MODEL: 'anthropic.claude-3-7-sonnet-20250219-v1:0'
  DOMAIN_NAME: ''
  ENABLE_HTTPS: 'true'
  INFERENCE_PROFILE_ARN: ''
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity &>/dev/null; then
            echo "::error::AWS credentials invalid or expired. Update repository secrets and try again."
            exit 1
          else
            echo "AWS credentials verified: $(aws sts get-caller-identity --query 'Arn' --output text)"
          fi
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5
      
      - name: "Set Terraform State Bucket"
        run: |
          BUCKET_NAME="pricing-agent-tf-state-tsynode"
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          echo "✓ Using S3 bucket: $BUCKET_NAME"
      
      - name: Initialize Terraform
        working-directory: ./infrastructure
        run: |
          # Initialize Terraform with S3 backend
          terraform init \
            -backend-config="bucket=pricing-agent-tf-state-tsynode" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Create ECR Repository
        working-directory: ./infrastructure
        run: |
          REPO_NAME="pricing-agent-staging"
          echo "Creating ECR repository $REPO_NAME if it doesn't exist"
          terraform apply -auto-approve -target=aws_ecr_repository.main
        env:
          TF_VAR_environment: staging
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: ${{ env.MODEL }}
          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}
          TF_VAR_enable_https: ${{ env.ENABLE_HTTPS }}
          TF_VAR_inference_profile_arn: ${{ env.INFERENCE_PROFILE_ARN }}
      
      - name: Set ECR Repository URL
        id: set-ecr-repo
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/pricing-agent-staging"
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "Using ECR repository: $ECR_REPO_URI"
      

      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-ecr-repo.outputs.ecr_repo_uri }}:latest
          no-cache: true
      
      - name: Create OpenSearch Security Policy
        run: |
          ENVIRONMENT="${{ env.ENVIRONMENT }}"
          echo "Creating OpenSearch security policy for $ENVIRONMENT environment..."
          
          # Create encryption policy for OpenSearch collection
          aws opensearchserverless create-security-policy \
            --name "pricing-agent-${ENVIRONMENT}-encryption-policy" \
            --type encryption \
            --policy '[{"Rules":[{"ResourceType":"collection","Resource":["collection/pricing-agent-'"$ENVIRONMENT"'-kb-collection"]}],"AWSOwnedKey":true}]' || echo "Policy may already exist, continuing"
      
      - name: Apply Terraform Infrastructure
        working-directory: ./infrastructure
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_model_id: ${{ env.MODEL }}
          TF_VAR_domain_name: ${{ env.DOMAIN_NAME }}
          TF_VAR_enable_https: ${{ env.ENABLE_HTTPS }}
          TF_VAR_inference_profile_arn: ${{ env.INFERENCE_PROFILE_ARN }}
        run: |
          echo "\n Deploying infrastructure...\n"
          
          # Note: Terraform has already been initialized and workspace selected in the previous step
          terraform plan -out=tfplan

          echo "\n Applying Terraform configuration...\n"
          
          echo "\n Checking S3 bucket contents...\n"
          aws s3 ls s3://$TF_BUCKET_NAME/ --recursive
          
          # Check current state
          echo "\n Checking current Terraform state...\n"
          terraform state list || echo "No resources in state yet"
          

          # Import existing resources if they exist
          echo "\n Importing existing resources if they exist...\n"
          aws s3 ls s3://$TF_BUCKET_NAME 2>/dev/null && \
            terraform import -allow-missing-config aws_s3_bucket.tf_state $TF_BUCKET_NAME || \
            echo "S3 bucket does not exist yet, will be created"
          
          aws dynamodb describe-table --table-name $TF_LOCK_TABLE 2>/dev/null && \
            terraform import -allow-missing-config aws_dynamodb_table.tf_lock $TF_LOCK_TABLE || \
            echo "DynamoDB table does not exist yet, will be created"
          
          # Import S3 bucket for policies if it exists
          echo "\n🔍 Checking for existing S3 policy bucket...\n"
          S3_BUCKET_NAME="pricing-agent-${ENVIRONMENT}-policies"
          aws s3api head-bucket --bucket "$S3_BUCKET_NAME" 2>/dev/null && {
            echo "S3 bucket $S3_BUCKET_NAME exists, importing..."
            terraform import -allow-missing-config aws_s3_bucket.policy "$S3_BUCKET_NAME" || echo "Import failed, but continuing"
          } || echo "S3 bucket doesn't exist, will be created"
          
          # Import CloudWatch log group if it exists
          echo "\n🔍 Checking for existing CloudWatch log group...\n"
          LOG_GROUP_NAME="/ecs/pricing-agent-${ENVIRONMENT}"
          aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP_NAME" --query "logGroups[?logGroupName=='$LOG_GROUP_NAME'].logGroupName" --output text | grep -q "$LOG_GROUP_NAME" && {
            echo "Log group $LOG_GROUP_NAME exists, importing..."
            terraform import -allow-missing-config aws_cloudwatch_log_group.main "$LOG_GROUP_NAME" || echo "Import failed, but continuing"
          } || echo "Log group doesn't exist, will be created"
          
          # Import SSM parameters if they exist
          echo "\n🔍 Checking for existing SSM parameters...\n"
          KB_PARAM_NAME="/pricing-agent-${ENVIRONMENT}/knowledge-base-id"
          SESSIONS_PARAM_NAME="/pricing-agent-${ENVIRONMENT}/sessions-table-name"
          
          aws ssm get-parameter --name "$KB_PARAM_NAME" 2>/dev/null && {
            echo "SSM parameter $KB_PARAM_NAME exists, importing..."
            terraform import -allow-missing-config aws_ssm_parameter.kb_id "$KB_PARAM_NAME" || echo "Import failed, but continuing"
          } || echo "SSM parameter doesn't exist, will be created"
          
          aws ssm get-parameter --name "$SESSIONS_PARAM_NAME" 2>/dev/null && {
            echo "SSM parameter $SESSIONS_PARAM_NAME exists, importing..."
            terraform import -allow-missing-config aws_ssm_parameter.sessions_table_name "$SESSIONS_PARAM_NAME" || echo "Import failed, but continuing"
          } || echo "SSM parameter doesn't exist, will be created"
          
          # Check if ECR repository exists and import it if needed
          echo "\n🔍 Checking for existing ECR repository...\n"
          ECR_REPO_NAME="pricing-agent-${ENVIRONMENT}"
          ECR_REPO_ARN=$(aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --query "repositories[0].repositoryArn" --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$ECR_REPO_ARN" != "NOT_FOUND" && "$ECR_REPO_ARN" != "None" ]]; then
            echo "Importing existing ECR repository: $ECR_REPO_ARN"
            terraform import aws_ecr_repository.main "$ECR_REPO_NAME" || echo "Import failed, but continuing"
          fi
          
          # Apply Terraform changes
          echo "\n🔧 Applying Terraform changes...\n"
          terraform apply -auto-approve
          
          # Get the ALB DNS name
          echo "\n🔍 Getting ALB DNS name...\n"
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null) || {
            echo "Failed to get ALB DNS from Terraform output, trying AWS CLI..."
            ALB_NAME="${NAME_PREFIX}-alb"
            ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query "LoadBalancers[0].DNSName" --output text 2>/dev/null) || {
              echo "Failed to get ALB DNS from AWS CLI"
              ALB_DNS="unknown"
            }
          }
          
          echo "ALB DNS: $ALB_DNS"
            -target=aws_route_table.private || echo "⚠️ Some routing resources already exist, continuing with deployment"
            
          # Check if we have any route table associations in the state
          echo "\n🔗 Checking for route table associations...\n"
          PUBLIC_ASSOC_COUNT=$(terraform state list | grep aws_route_table_association.public | wc -l || echo "0")
          PRIVATE_ASSOC_COUNT=$(terraform state list | grep aws_route_table_association.private | wc -l || echo "0")
          
          # Only apply route table associations if they exist in the state
          if [[ "$PUBLIC_ASSOC_COUNT" -gt 0 ]]; then
            echo "Found $PUBLIC_ASSOC_COUNT public route table associations in state, applying..."
            terraform apply -auto-approve -target=aws_route_table_association.public || echo "⚠️ Some public route table associations may have failed, but continuing"
          else
            echo "No public route table associations found in state, skipping"
          fi
          
          if [[ "$PRIVATE_ASSOC_COUNT" -gt 0 ]]; then
            echo "Found $PRIVATE_ASSOC_COUNT private route table associations in state, applying..."
            terraform apply -auto-approve -target=aws_route_table_association.private || echo "⚠️ Some private route table associations may have failed, but continuing"
          else
            echo "No private route table associations found in state, skipping"
          fi
          
          # Apply NAT gateway last
          echo "\n🔊 Applying NAT gateway...\n"
          terraform apply -auto-approve -target=aws_nat_gateway.main || echo "⚠️ NAT gateway may already exist, continuing with deployment"
          
          # Check for existing security groups
          echo "Checking for existing security groups..."
          ALB_SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=pricing-agent-${ENVIRONMENT}-alb-sg" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ALB_SG" != "NOT_FOUND" && "$ALB_SG" != "None" ]]; then
            echo "Importing existing ALB security group: $ALB_SG"
            terraform import aws_security_group.alb $ALB_SG || echo "Import failed, but continuing"
          fi
          
          ECS_SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=pricing-agent-${ENVIRONMENT}-ecs-sg" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ECS_SG" != "NOT_FOUND" && "$ECS_SG" != "None" ]]; then
            echo "Importing existing ECS security group: $ECS_SG"
            terraform import aws_security_group.ecs $ECS_SG || echo "Import failed, but continuing"
          fi
          
          # Apply security groups
          echo "Applying security groups..."
          terraform apply -auto-approve \
            -target=aws_security_group.alb \
            -target=aws_security_group.ecs \
            -target=aws_security_group_rule.alb_ingress \
            -target=aws_security_group_rule.alb_egress \
            -target=aws_security_group_rule.ecs_ingress \
            -target=aws_security_group_rule.ecs_egress || echo "⚠️ Some security group resources already exist, continuing with deployment"
          
          # Apply load balancer - first import existing resources if they exist
          echo "Checking for existing ALB resources..."
          
          # Check if ALB exists
          ALB_EXISTS=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ALB_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing ALB..."
            ALB_ARN=$(echo "$ALB_EXISTS" | jq -r '.LoadBalancers[0].LoadBalancerArn')
            terraform import aws_lb.main "$ALB_ARN" || echo "Import failed, but continuing"
            
            # Check if target group exists
            TG_EXISTS=$(aws elbv2 describe-target-groups --names pricing-agent-${ENVIRONMENT}-tg 2>/dev/null || echo "NOT_FOUND")
            if [[ "$TG_EXISTS" != "NOT_FOUND" ]]; then
              echo "Importing existing target group..."
              TG_ARN=$(echo "$TG_EXISTS" | jq -r '.TargetGroups[0].TargetGroupArn')
              terraform import aws_lb_target_group.main "$TG_ARN" || echo "Import failed, but continuing"
              
              # Check if HTTP listener exists
              LISTENER_EXISTS=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" 2>/dev/null || echo "NOT_FOUND")
              if [[ "$LISTENER_EXISTS" != "NOT_FOUND" ]]; then
                HTTP_LISTENER=$(echo "$LISTENER_EXISTS" | jq -r '.Listeners[] | select(.Port == 80)')
                if [[ -n "$HTTP_LISTENER" ]]; then
                  echo "Importing existing HTTP listener..."
                  HTTP_LISTENER_ARN=$(echo "$HTTP_LISTENER" | jq -r '.ListenerArn')
                  terraform import aws_lb_listener.http "$HTTP_LISTENER_ARN" || echo "Import failed, but continuing"
                fi
              fi
            fi
          fi
          
          echo "Applying load balancer..."
          terraform apply -auto-approve \
            -target=aws_lb.main \
            -target=aws_lb_target_group.main \
            -target=aws_lb_listener.http || echo "Some ALB resources already exist, continuing with other resources"
          
          # Apply ECS resources (cluster, task definition, service)
          echo "\n🐳 Applying ECS resources...\n"
          
          # Check for existing CloudWatch Log Group
          echo "Checking for existing CloudWatch Log Group..."
          LOG_GROUP_EXISTS=$(aws logs describe-log-groups --log-group-name-prefix "/ecs/pricing-agent-${ENVIRONMENT}" 2>/dev/null || echo "NOT_FOUND")
          if [[ "$LOG_GROUP_EXISTS" != "NOT_FOUND" ]]; then
            LOG_GROUP_NAME=$(echo "$LOG_GROUP_EXISTS" | jq -r '.logGroups[0].logGroupName')
            if [[ -n "$LOG_GROUP_NAME" && "$LOG_GROUP_NAME" != "null" ]]; then
              echo "Importing existing CloudWatch Log Group: $LOG_GROUP_NAME"
              terraform import aws_cloudwatch_log_group.main "$LOG_GROUP_NAME" || echo "Import failed, but continuing"
            fi
          fi
          
          # Apply ECS cluster and CloudWatch Log Group
          echo "Applying ECS cluster and CloudWatch Log Group..."
          terraform apply -auto-approve -target=aws_ecs_cluster.main -target=aws_cloudwatch_log_group.main || echo "Some ECS resources already exist, continuing with other resources"
          
          # Apply ECS task definition
          echo "Applying ECS task definition..."
          terraform apply -auto-approve -target=aws_ecs_task_definition.main || echo "⚠️ ECS task definition may already exist, continuing with deployment"
          
          # ===== ECS Service Deployment - Consolidated Step =====
          echo "\n🔍 Performing VPC consistency check before ECS deployment...\n"
          
          # Get VPC ID from ALB
          ALB_VPC_ID=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb --query "LoadBalancers[0].VpcId" --output text 2>/dev/null)
          if [[ -z "$ALB_VPC_ID" || "$ALB_VPC_ID" == "None" ]]; then
            echo "⚠️ WARNING: Could not determine ALB VPC ID. This may cause networking issues."
          else
            echo "✅ ALB VPC ID: $ALB_VPC_ID"
          fi
          
          # Get security group ID and verify it's in the same VPC
          ECS_SG=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=pricing-agent-${ENVIRONMENT}-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
          if [[ -n "$ECS_SG" && "$ECS_SG" != "None" ]]; then
            ECS_SG_VPC=$(aws ec2 describe-security-groups --group-ids $ECS_SG --query "SecurityGroups[0].VpcId" --output text)
            if [[ "$ECS_SG_VPC" != "$ALB_VPC_ID" ]]; then
              echo "⚠️ CRITICAL: ECS security group ($ECS_SG) is in VPC $ECS_SG_VPC but ALB is in VPC $ALB_VPC_ID"
              echo "This will cause networking issues. Attempting to find correct security group..."
              
              # Try to find a security group in the same VPC as the ALB
              CORRECT_SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=group-name,Values=*ecs*" --query "SecurityGroups[0].GroupId" --output text)
              if [[ -n "$CORRECT_SG" && "$CORRECT_SG" != "None" ]]; then
                echo "Found alternative security group in correct VPC: $CORRECT_SG"
                ECS_SG=$CORRECT_SG
              fi
            else
              echo "✅ ECS security group is in the correct VPC"
            fi
          else
            echo "⚠️ WARNING: Could not find ECS security group"
          fi
          
          # Find subnets in the ALB VPC
          echo "\n🔍 Finding appropriate subnets in VPC $ALB_VPC_ID...\n"
          
          # First try to find private subnets in the ALB VPC
          SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
          SUBNET_TYPE="private"
          ASSIGN_PUBLIC_IP="DISABLED"
          
          # If no private subnets found, fall back to public subnets
          if [[ -z "$SUBNET_IDS" || "$SUBNET_IDS" == "None" ]]; then
            echo "No private subnets found in ALB VPC. Falling back to public subnets."
            SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-public-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            SUBNET_TYPE="public"
            ASSIGN_PUBLIC_IP="ENABLED"  # Enable public IP when using public subnets
          fi
          
          if [[ -z "$SUBNET_IDS" || "$SUBNET_IDS" == "None" ]]; then
            echo "⚠️ CRITICAL: Could not find any subnets in VPC $ALB_VPC_ID"
            echo "Attempting to find any subnets in this VPC..."
            SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            if [[ -z "$SUBNET_IDS" || "$SUBNET_IDS" == "None" ]]; then
              echo "⚠️ CRITICAL: No subnets found in VPC $ALB_VPC_ID. ECS service deployment will likely fail."
            else
              echo "Found generic subnets: $SUBNET_IDS"
              SUBNET_TYPE="generic"
              ASSIGN_PUBLIC_IP="ENABLED"  # Enable public IP to be safe
            fi
          else
            echo "✅ Using $SUBNET_TYPE subnets: $SUBNET_IDS"
          fi
          
          # Get target group ARN
          TG_ARN=$(aws elbv2 describe-target-groups --names pricing-agent-${ENVIRONMENT}-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null)
          if [[ -z "$TG_ARN" || "$TG_ARN" == "None" ]]; then
            echo "⚠️ WARNING: Could not find target group ARN"
          else
            echo "✅ Target group ARN: $TG_ARN"
          fi
          
          # Get latest task definition
          echo "\n🔍 Getting latest task definition...\n"
          LATEST_TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition pricing-agent-${ENVIRONMENT} --query "taskDefinition.taskDefinitionArn" --output text 2>/dev/null)
          if [[ -z "$LATEST_TASK_DEF_ARN" || "$LATEST_TASK_DEF_ARN" == "None" ]]; then
            echo "⚠️ WARNING: Could not find task definition"
          else
            echo "✅ Latest task definition: $LATEST_TASK_DEF_ARN"
          fi
          
          # Check if service already exists
          echo "\n🔍 Checking if ECS service already exists...\n"
          SERVICE_EXISTS=$(aws ecs describe-services --cluster pricing-agent-${ENVIRONMENT}-cluster --services pricing-agent-${ENVIRONMENT}-service --query "services[0].status" 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$SERVICE_EXISTS" != "NOT_FOUND" && "$SERVICE_EXISTS" != "null" ]]; then
            echo "✅ ECS service already exists with status: $SERVICE_EXISTS"
            echo "Importing existing service into Terraform state..."
            terraform import aws_ecs_service.main pricing-agent-${ENVIRONMENT}-cluster/pricing-agent-${ENVIRONMENT}-service || echo "Import failed, but continuing"
            
            echo "Updating existing service with latest task definition and network configuration..."
            if [[ -n "$LATEST_TASK_DEF_ARN" && -n "$ECS_SG" && -n "$SUBNET_IDS" ]]; then
              aws ecs update-service \
                --cluster pricing-agent-${ENVIRONMENT}-cluster \
                --service pricing-agent-${ENVIRONMENT}-service \
                --task-definition $LATEST_TASK_DEF_ARN \
                --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$ECS_SG],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
                --force-new-deployment
              
              echo "✅ Service update initiated with correct VPC configuration"
            else
              echo "⚠️ Missing required parameters for service update"
            fi
          else
            echo "ECS service does not exist. Attempting to create it..."
            
            # Try Terraform first with targeted approach to avoid lifecycle conflicts
            echo "Attempting to create service via Terraform..."
            # Import resources that might have been created manually
            
            # Import ECS service if it exists but is not in Terraform state
            terraform state list aws_ecs_service.main &> /dev/null || terraform import aws_ecs_service.main pricing-agent-${ENVIRONMENT}-cluster/pricing-agent-${ENVIRONMENT}-service &> /dev/null || echo "Service not imported, will create new"
            
            # Import Bedrock inference profile if it exists but is not in Terraform state
            if [ -n "$INFERENCE_PROFILE_ARN" ]; then
              terraform state list aws_bedrock_inference_profile.claude_opus &> /dev/null || terraform import aws_bedrock_inference_profile.claude_opus "$INFERENCE_PROFILE_ARN" &> /dev/null || echo "Inference profile not imported, will create new"
            fi
            
            # Import S3 bucket for Terraform state if it exists but is not in Terraform state
            if aws s3 ls "s3://$TF_BUCKET_NAME" &> /dev/null; then
              terraform state list aws_s3_bucket.terraform_state &> /dev/null || terraform import aws_s3_bucket.terraform_state "$TF_BUCKET_NAME" &> /dev/null || echo "S3 bucket not imported, will create new"
            fi
            
            # Then apply only the ECS service
            terraform apply -auto-approve -target=aws_ecs_service.main || {
              echo "\n⚠️ Failed to create service through Terraform. Trying AWS CLI...\n"
              
              if [[ -n "$LATEST_TASK_DEF_ARN" && -n "$ECS_SG" && -n "$SUBNET_IDS" && -n "$TG_ARN" ]]; then
                echo "Creating ECS service using AWS CLI with correct VPC configuration..."
                aws ecs create-service \
                  --cluster pricing-agent-${ENVIRONMENT}-cluster \
                  --service-name pricing-agent-${ENVIRONMENT}-service \
                  --task-definition $LATEST_TASK_DEF_ARN \
                  --desired-count 1 \
                  --launch-type FARGATE \
                  --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$ECS_SG],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
                  --load-balancers "targetGroupArn=$TG_ARN,containerName=pricing-agent-${ENVIRONMENT}-container,containerPort=8501" || echo "Failed to create service using AWS CLI"
              else
                echo "⚠️ CRITICAL: Missing required parameters for ECS service creation:"
                echo "Task Definition ARN: $LATEST_TASK_DEF_ARN"
                echo "ECS Security Group: $ECS_SG"
                echo "Subnet IDs: $SUBNET_IDS"
                echo "Target Group ARN: $TG_ARN"
              fi
            }
          fi
          
          # Set Terraform variables
          export TF_VAR_environment="$ENVIRONMENT"
          export TF_VAR_project_name="pricing-agent"
          export TF_VAR_model_id="$MODEL"
          export TF_VAR_domain_name="$DOMAIN_NAME"
          export TF_VAR_enable_https="$ENABLE_HTTPS"
          export TF_VAR_inference_profile_arn="$INFERENCE_PROFILE_ARN"
          
          echo "\n✅ Infrastructure deployment complete!\n"
      - name: Verify ECS Service Status
        # ECS Service creation has been consolidated into the previous step
        run: |
          echo "\n🔍 Verifying ECS service status...\n"
          
          # Get the ECS cluster, service and container names
          CLUSTER_NAME="pricing-agent-${ENVIRONMENT}-cluster"
          SERVICE_NAME="pricing-agent-${ENVIRONMENT}-service"
          CONTAINER_NAME="pricing-agent-${ENVIRONMENT}-container"
          
          # Check if the service exists and its status
          echo "Checking ECS service status..."
          SERVICE_STATUS=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].status" --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$SERVICE_STATUS" == "ACTIVE" ]]; then
            echo "\n✅ ECS service is active and running\n"
            
            # Get deployment status
            DEPLOYMENT_STATUS=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].deployments[0].status" --output text)
            RUNNING_COUNT=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].runningCount" --output text)
            DESIRED_COUNT=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].desiredCount" --output text)
            
            echo "Deployment status: $DEPLOYMENT_STATUS"
            echo "Running tasks: $RUNNING_COUNT / $DESIRED_COUNT"
            
            # Check if there are any task events that might indicate issues
            echo "\nRecent service events:"
            aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].events[0:3]" --output json
          elif [[ "$SERVICE_STATUS" == "NOT_FOUND" ]]; then
            echo "\n⚠️ ECS service was not found. Deployment may have failed.\n"
          else
            echo "\n⚠️ ECS service status: $SERVICE_STATUS\n"
            echo "Service may still be deploying or in an unexpected state."
          fi
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          
      - name: Output Deployment Information
        run: |
          # Get ALB DNS from Terraform and save to a file to avoid obfuscation
          cd infrastructure
          # First check if terraform output is available
          if terraform output &>/dev/null; then
            # Try to get the outputs in a more robust way
            ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || echo "Not available")
            VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "Not available")
          else
            echo "⚠️ Terraform outputs not available, using direct AWS CLI queries"
            ALB_DNS=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb --query "LoadBalancers[0].DNSName" --output text 2>/dev/null || echo "Not available")
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "Not available")
          fi
          
          # Create a clear deployment summary
          echo "\n=================================================================="
          echo "🎉 PRICING AGENT DEPLOYMENT SUMMARY - ${ENVIRONMENT} ENVIRONMENT 🎉"
          echo "==================================================================\n"
          
          echo "📊 INFRASTRUCTURE DETAILS:"
          echo "-------------------------"
          echo "Environment: ${ENVIRONMENT}"
          echo "VPC ID: $VPC_ID"
          
          # Get target group ARN without obfuscation
          TG_ARN=$(aws elbv2 describe-target-groups \
            --name pricing-agent-${ENVIRONMENT}-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || echo "Not available")
          
          # Extract just the ID portion from the ARN
          if [[ "$TG_ARN" != "Not available" ]]; then
            TG_ID=$(echo $TG_ARN | awk -F'/' '{print $2}')
            echo "Target Group: pricing-agent-${ENVIRONMENT}-tg ($TG_ID)"
          else
            echo "Target Group: Not available"
          fi
          
          # Get ECS cluster and service status
          CLUSTER_NAME="pricing-agent-${ENVIRONMENT}-cluster"
          SERVICE_NAME="pricing-agent-${ENVIRONMENT}-service"
          
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "NOT_FOUND")
          
          echo "ECS Cluster: $CLUSTER_NAME"
          echo "ECS Service: $SERVICE_NAME ($SERVICE_STATUS)"
          
          echo "\n🔗 ACCESS INFORMATION:"
          echo "-------------------------"
          if [[ "$ALB_DNS" != "Not available" ]]; then
            echo "APPLICATION URL: http://$ALB_DNS"
          else
            echo "APPLICATION URL: Check AWS Console for ALB DNS name"
          fi
          
          echo "\n📝 DEPLOYMENT NOTES:"
          echo "-------------------------"
          echo "- All resources are deployed in the same VPC"
          echo "- Using Terraform workspace: ${ENVIRONMENT}"
          echo "- Model: ${MODEL}"
          
          echo "\n==================================================================\n"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
