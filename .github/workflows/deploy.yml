name: Deploy Pricing Agent

on:
  push:
    branches: [main]
    paths-ignore:
      - 'policies/**'  # Policies have their own workflow
  workflow_dispatch:  # Allow manual triggering

env:
  ENVIRONMENT: dev  # Default environment, can be overridden in repository secrets

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Create S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Create S3 bucket for Terraform state if it doesn't exist
          aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null || \
          aws s3api create-bucket \
            --bucket $BUCKET_NAME \
            --region ${{ secrets.AWS_REGION }} \
            $([[ "${{ secrets.AWS_REGION }}" == "us-east-1" ]] || echo "--create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}")
          
          # Enable versioning on the bucket
          aws s3api put-bucket-versioning \
            --bucket $BUCKET_NAME \
            --versioning-configuration Status=Enabled
          
          # Block public access to the bucket
          aws s3api put-public-access-block \
            --bucket $BUCKET_NAME \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          # Enable encryption on the bucket
          aws s3api put-bucket-encryption \
            --bucket $BUCKET_NAME \
            --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          
          # Initialize with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent-${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      
      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Import Existing Resources
        working-directory: ./infrastructure
        run: |
          echo "Importing existing resources from troubleshooting branch deployment..."
          
          # Import SSM parameters
          terraform import aws_ssm_parameter.kb_id /pricing-agent-${ENVIRONMENT}/knowledge-base-id || true
          terraform import aws_ssm_parameter.session_bucket_name /pricing-agent-${ENVIRONMENT}/session-bucket-name || true
          terraform import aws_ssm_parameter.policy_bucket_name /pricing-agent-${ENVIRONMENT}/policy-bucket-name || true
          
          # Import DynamoDB tables
          terraform import aws_dynamodb_table.pricing pricing-agent-${ENVIRONMENT}-pricing-rules || true
          terraform import aws_dynamodb_table.inventory pricing-agent-${ENVIRONMENT}-inventory || true
          
          # Import CloudWatch log group
          terraform import aws_cloudwatch_log_group.main /ecs/pricing-agent-${ENVIRONMENT} || true
          
          # Import ECR repository
          terraform import aws_ecr_repository.main pricing-agent-${ENVIRONMENT} || true
          
          # Import IAM roles
          terraform import aws_iam_role.ecs_execution pricing-agent-${ENVIRONMENT}-ecs-execution-role || true
          terraform import aws_iam_role.ecs_task pricing-agent-${ENVIRONMENT}-ecs-task-role || true
          
          # Import ALB and related resources
          terraform import aws_lb.main arn:aws:elasticloadbalancing:*:*:loadbalancer/app/pricing-agent-${ENVIRONMENT}-alb/* || true
          terraform import aws_lb_listener.http arn:aws:elasticloadbalancing:*:*:listener/app/pricing-agent-${ENVIRONMENT}-alb/*/* || true
          terraform import aws_security_group.alb pricing-agent-${ENVIRONMENT}-alb-sg || true
          
          # Import VPC resources
          terraform import aws_vpc.main vpc-* || true
          
          # Note: For resources with wildcards, you may need to get the exact IDs from AWS console
          # and update these import commands with the exact IDs
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
      
      - name: Terraform Apply ECR Only
        working-directory: ./infrastructure
        run: |
          # Create only the ECR repository first
          terraform apply -auto-approve -target=aws_ecr_repository.main
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Set ECR Repository URL
        id: set-ecr-repo
        run: |
          # Get account ID for constructing ECR repository URL
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${AWS_REGION}
          
          # Construct the ECR URL manually
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/pricing-agent-${ENVIRONMENT}"
          
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "Constructed ECR repository URL: $ECR_REPO_URI"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
      

      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-ecr-repo.outputs.ecr_repo_uri }}:latest
          no-cache: true
      
      - name: Terraform Apply Rest of Infrastructure
        working-directory: ./infrastructure
        run: |
          # Now deploy the rest of the infrastructure
          terraform apply -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Update ECS service
        run: |
          # Get cluster and service names from Terraform output
          cd infrastructure
          
          # Check if the ECS service exists in the state
          terraform state list | grep aws_ecs_service || {
            echo "ECS service not found in Terraform state. Skipping ECS service update."
            exit 0
          }
          
          # Get the ECS cluster and service names
          CLUSTER_NAME="pricing-agent-${ENVIRONMENT}-cluster"
          SERVICE_NAME="pricing-agent-${ENVIRONMENT}-service"
          
          # Force new deployment
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment || {
            echo "Failed to update ECS service. This is expected if the service doesn't exist yet."
            echo "The service will be created by Terraform in the next step."
          }
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
      
      - name: Output Deployment Information
        run: |
          echo "\n🚀 Deployment Complete! 🚀\n"
          echo "Pricing Agent has been successfully deployed to AWS."
          
          cd infrastructure
          
          # Try to get the ALB DNS name
          ALB_DNS=$(terraform output alb_dns_name 2>/dev/null | tr -d '"' || echo "")
          
          if [[ -n "$ALB_DNS" && "$ALB_DNS" != "null" ]]; then
            echo "\nAccess your Pricing Agent at: http://$ALB_DNS"
          else
            echo "\nPricing Agent URL will be available soon. Check AWS Console for details."
          fi
          
          echo "\nThis deployment uses:"
          echo "- Strands Agents SDK with Streamlit UI"
          echo "- Bedrock Knowledge Base for pricing policies"
          echo "- DynamoDB for pricing rules and inventory data"
          echo "- S3 for policy documents and session data"
          
          echo "\nDeployment complete!"
