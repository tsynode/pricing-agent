name: Deploy Pricing Agent

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'policies/**'
  workflow_dispatch:
    inputs: {}

env:
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity &>/dev/null; then
            echo "::error::AWS credentials invalid or expired. Update repository secrets and try again."
            exit 1
          else
            echo "AWS credentials verified: $(aws sts get-caller-identity --query 'Arn' --output text)"
          fi
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5
      
      - name: Create S3 Bucket for Terraform State
        run: |
          # Create S3 bucket for Terraform state if it doesn't exist
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          echo "Creating/verifying S3 bucket: $BUCKET_NAME"
          
          # Check if bucket exists
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket already exists"
          else
            echo "Creating bucket..."
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region us-east-1
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            
            echo "Bucket created and configured"
          fi
      
      - name: Initialize Terraform
        working-directory: ./infrastructure
        run: |
          # Initialize Terraform with hardcoded S3 backend
          terraform init

      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Create ECR Repository
        working-directory: ./infrastructure
        run: |
          REPO_NAME="pricing-agent"
          echo "Creating ECR repository $REPO_NAME if it doesn't exist"
          terraform apply -auto-approve -target=aws_ecr_repository.main
        env:
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: 'anthropic.claude-3-haiku-20240307-v1:0'
      
      - name: Set ECR Repository URL
        id: set-ecr-repo
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/pricing-agent"
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "Using ECR repository: $ECR_REPO_URI"
      

      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-ecr-repo.outputs.ecr_repo_uri }}:latest
          no-cache: true
      
      - name: Create OpenSearch Security Policy
        run: |
          # Create encryption policy for OpenSearch collection
          aws opensearchserverless create-security-policy \
            --name "pricing-agent-encryption-policy" \
            --type encryption \
            --policy '[{"Rules":[{"ResourceType":"collection","Resource":["collection/pricing-agent-kb-collection"]}],"AWSOwnedKey":true}]' || echo "Policy may already exist, continuing"
      
      - name: Apply Terraform Infrastructure
        working-directory: ./infrastructure
        env:
          TF_VAR_project_name: 'pricing-agent'
          TF_VAR_model_id: 'anthropic.claude-3-haiku-20240307-v1:0'
        run: |
          # Generate a plan
          terraform plan -out=tfplan

          # Apply the Terraform configuration
          terraform apply -auto-approve
      - name: Verify ECS Service Status
        run: |
          CLUSTER_NAME="pricing-agent-staging-cluster"
          SERVICE_NAME="pricing-agent-staging-service"
          
          # Check service status
          SERVICE_INFO=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$SERVICE_INFO" != "NOT_FOUND" ]]; then
            echo "ECS service is deployed"
            RUNNING_COUNT=$(echo $SERVICE_INFO | jq -r '.services[0].runningCount' 2>/dev/null || echo "unknown")
            DESIRED_COUNT=$(echo $SERVICE_INFO | jq -r '.services[0].desiredCount' 2>/dev/null || echo "unknown")
            echo "Running tasks: $RUNNING_COUNT / $DESIRED_COUNT"
          else
            echo "ECS service not found. Deployment may still be in progress."
          fi
          
      - name: Output Application URL
        run: |
          cd infrastructure
          ALB_DNS=$(terraform output -raw alb_dns_name 2>/dev/null || \
            aws elbv2 describe-load-balancers --names pricing-agent-staging-alb --query "LoadBalancers[0].DNSName" --output text 2>/dev/null || \
            echo "Not available")
          
          echo "APPLICATION URL: http://$ALB_DNS"
