name: Deploy Pricing Agent

on:
  push:
    branches: [main]
    paths-ignore:
      - 'policies/**'  # Policies have their own workflow
  workflow_dispatch:  # Allow manual triggering
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      model_id:
        description: 'AI model to use'
        required: true
        default: 'anthropic.claude-opus-4-20250514-v1:0'
        type: choice
        options:
          - anthropic.claude-opus-4-20250514-v1:0
          - anthropic.claude-sonnet-4-20250514-v1:0
          - anthropic.claude-3-7-sonnet-20250219-v1:0
      domain_name:
        description: 'Domain name for the application (e.g., pricing-agent.example.com)'
        required: false
        type: string
      enable_https:
        description: 'Enable HTTPS for the ALB'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}  # Use input or default to dev
  MODEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.model_id || 'anthropic.claude-opus-4-20250514-v1:0' }}  # Use input or default to Claude 4 Opus
  DOMAIN_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.domain_name || '' }}  # Domain name for HTTPS
  ENABLE_HTTPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_https || 'true' }}  # Enable HTTPS

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Create S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Create S3 bucket for Terraform state if it doesn't exist
          aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null || \
          aws s3api create-bucket \
            --bucket $BUCKET_NAME \
            --region ${{ secrets.AWS_REGION }} \
            $([[ "${{ secrets.AWS_REGION }}" == "us-east-1" ]] || echo "--create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}")
          
          # Enable versioning on the bucket
          aws s3api put-bucket-versioning \
            --bucket $BUCKET_NAME \
            --versioning-configuration Status=Enabled
          
          # Block public access to the bucket
          aws s3api put-public-access-block \
            --bucket $BUCKET_NAME \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          # Enable encryption on the bucket
          aws s3api put-bucket-encryption \
            --bucket $BUCKET_NAME \
            --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          
          # Initialize with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent-${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      
      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate
      
      - name: Import or Create ECR Repository
        working-directory: ./infrastructure
        run: |
          # Check if ECR repository already exists
          REPO_NAME="pricing-agent-${ENVIRONMENT}"
          echo "Checking if ECR repository $REPO_NAME already exists..."
          
          # Try to describe the repository with better error handling
          REPO_EXISTS=$(aws ecr describe-repositories --repository-names $REPO_NAME 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$REPO_EXISTS" != "NOT_FOUND" ]]; then
            echo "ECR repository already exists. Importing into Terraform state..."
            terraform import aws_ecr_repository.main $REPO_NAME || {
              echo "Failed to import ECR repository. This is not critical, continuing..."
            }
          else
            echo "ECR repository does not exist. Creating it..."
            terraform apply -auto-approve -target=aws_ecr_repository.main
          fi
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: ${{ env.MODEL }}
      
      - name: Set ECR Repository URL
        id: set-ecr-repo
        run: |
          # Get account ID for constructing ECR repository URL
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION=${AWS_REGION}
          
          # Construct the ECR URL manually
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/pricing-agent-${ENVIRONMENT}"
          
          echo "ecr_repo_uri=$ECR_REPO_URI" >> $GITHUB_OUTPUT
          echo "Constructed ECR repository URL: $ECR_REPO_URI"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
      

      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-ecr-repo.outputs.ecr_repo_uri }}:latest
          no-cache: true
      
      - name: Terraform Apply Infrastructure
        working-directory: ./infrastructure
        run: |
          echo "\n🔧 Applying infrastructure with lifecycle blocks...\n"
          
          # Apply core infrastructure first (DynamoDB, S3, IAM)
          echo "\n📦 Applying core infrastructure (DynamoDB, S3, IAM)...\n"
          
          # Apply DynamoDB tables - first import existing tables if they exist
          echo "Checking for existing DynamoDB tables..."
          
          # Check if inventory table exists
          INVENTORY_TABLE_EXISTS=$(aws dynamodb describe-table --table-name pricing-agent-${ENVIRONMENT}-inventory 2>/dev/null || echo "NOT_FOUND")
          if [[ "$INVENTORY_TABLE_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing inventory table..."
            terraform import aws_dynamodb_table.inventory pricing-agent-${ENVIRONMENT}-inventory || echo "Import failed, but continuing"
          fi
          
          # Check if pricing table exists
          PRICING_TABLE_EXISTS=$(aws dynamodb describe-table --table-name pricing-agent-${ENVIRONMENT}-pricing-rules 2>/dev/null || echo "NOT_FOUND")
          if [[ "$PRICING_TABLE_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing pricing table..."
            terraform import aws_dynamodb_table.pricing pricing-agent-${ENVIRONMENT}-pricing-rules || echo "Import failed, but continuing"
          fi
          
          echo "Applying DynamoDB tables..."
          terraform apply -auto-approve -target=aws_dynamodb_table.inventory -target=aws_dynamodb_table.pricing || echo "Tables already exist, continuing with other resources"
          
          # Apply S3 buckets - our lifecycle blocks will handle existing resources
          echo "Applying S3 buckets and configurations..."
          terraform apply -auto-approve \
            -target=aws_s3_bucket.policy \
            -target=aws_s3_bucket.session \
            -target=aws_s3_bucket_versioning.policy_versioning \
            -target=aws_s3_bucket_versioning.session_versioning \
            -target=aws_s3_bucket_server_side_encryption_configuration.policy_encryption \
            -target=aws_s3_bucket_server_side_encryption_configuration.session_encryption \
            -target=aws_s3_bucket_lifecycle_configuration.session_lifecycle
          
          # Apply IAM roles and policies - first import existing resources if they exist
          echo "Checking for existing IAM roles and policies..."
          
          # Check if ECS execution role exists
          ECS_EXEC_ROLE_EXISTS=$(aws iam get-role --role-name pricing-agent-${ENVIRONMENT}-ecs-execution-role 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ECS_EXEC_ROLE_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing ECS execution role..."
            terraform import aws_iam_role.ecs_execution pricing-agent-${ENVIRONMENT}-ecs-execution-role || echo "Import failed, but continuing"
          fi
          
          # Check if ECS task role exists
          ECS_TASK_ROLE_EXISTS=$(aws iam get-role --role-name pricing-agent-${ENVIRONMENT}-ecs-task-role 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ECS_TASK_ROLE_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing ECS task role..."
            terraform import aws_iam_role.ecs_task pricing-agent-${ENVIRONMENT}-ecs-task-role || echo "Import failed, but continuing"
          fi
          
          # Check if ECS task policy exists
          ECS_TASK_POLICY_EXISTS=$(aws iam get-policy --policy-arn arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):policy/pricing-agent-${ENVIRONMENT}-ecs-task-policy 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ECS_TASK_POLICY_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing ECS task policy..."
            terraform import aws_iam_policy.ecs_task_policy arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):policy/pricing-agent-${ENVIRONMENT}-ecs-task-policy || echo "Import failed, but continuing"
          fi
          
          echo "Applying IAM roles and policies..."
          terraform apply -auto-approve \
            -target=aws_iam_role.ecs_task \
            -target=aws_iam_role.ecs_execution \
            -target=aws_iam_policy.ecs_task_policy \
            -target=aws_iam_role_policy_attachment.ecs_task \
            -target=aws_iam_role_policy_attachment.ecs_execution || echo "Some IAM resources already exist, continuing with other resources"
          
          # Apply networking components (VPC, subnets, security groups, ALB)
          echo "\n🌐 Applying networking components...\n"
          
          # Apply VPC and subnets
          echo "Applying VPC and subnets..."
          terraform apply -auto-approve \
            -target=aws_vpc.main \
            -target=aws_subnet.public \
            -target=aws_subnet.private
          
          # Apply routing components
          echo "Applying routing components..."
          terraform apply -auto-approve \
            -target=aws_internet_gateway.main \
            -target=aws_route_table.public \
            -target=aws_route_table.private \
            -target=aws_route_table_association.public \
            -target=aws_route_table_association.private \
            -target=aws_nat_gateway.main
          
          # Apply security groups
          echo "Applying security groups..."
          terraform apply -auto-approve \
            -target=aws_security_group.alb \
            -target=aws_security_group.ecs \
            -target=aws_security_group_rule.alb_ingress \
            -target=aws_security_group_rule.alb_egress \
            -target=aws_security_group_rule.ecs_ingress \
            -target=aws_security_group_rule.ecs_egress
          
          # Apply load balancer - first import existing resources if they exist
          echo "Checking for existing ALB resources..."
          
          # Check if ALB exists
          ALB_EXISTS=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb 2>/dev/null || echo "NOT_FOUND")
          if [[ "$ALB_EXISTS" != "NOT_FOUND" ]]; then
            echo "Importing existing ALB..."
            ALB_ARN=$(echo "$ALB_EXISTS" | jq -r '.LoadBalancers[0].LoadBalancerArn')
            terraform import aws_lb.main "$ALB_ARN" || echo "Import failed, but continuing"
            
            # Check if target group exists
            TG_EXISTS=$(aws elbv2 describe-target-groups --names pricing-agent-${ENVIRONMENT}-tg 2>/dev/null || echo "NOT_FOUND")
            if [[ "$TG_EXISTS" != "NOT_FOUND" ]]; then
              echo "Importing existing target group..."
              TG_ARN=$(echo "$TG_EXISTS" | jq -r '.TargetGroups[0].TargetGroupArn')
              terraform import aws_lb_target_group.main "$TG_ARN" || echo "Import failed, but continuing"
              
              # Check if HTTP listener exists
              LISTENER_EXISTS=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" 2>/dev/null || echo "NOT_FOUND")
              if [[ "$LISTENER_EXISTS" != "NOT_FOUND" ]]; then
                HTTP_LISTENER=$(echo "$LISTENER_EXISTS" | jq -r '.Listeners[] | select(.Port == 80)')
                if [[ -n "$HTTP_LISTENER" ]]; then
                  echo "Importing existing HTTP listener..."
                  HTTP_LISTENER_ARN=$(echo "$HTTP_LISTENER" | jq -r '.ListenerArn')
                  terraform import aws_lb_listener.http "$HTTP_LISTENER_ARN" || echo "Import failed, but continuing"
                fi
              fi
            fi
          fi
          
          echo "Applying load balancer..."
          terraform apply -auto-approve \
            -target=aws_lb.main \
            -target=aws_lb_target_group.main \
            -target=aws_lb_listener.http || echo "Some ALB resources already exist, continuing with other resources"
          
          # Apply ECS resources (cluster, task definition, service)
          echo "\n🐳 Applying ECS resources...\n"
          
          # Check for existing CloudWatch Log Group
          echo "Checking for existing CloudWatch Log Group..."
          LOG_GROUP_EXISTS=$(aws logs describe-log-groups --log-group-name-prefix "/ecs/pricing-agent-${ENVIRONMENT}" 2>/dev/null || echo "NOT_FOUND")
          if [[ "$LOG_GROUP_EXISTS" != "NOT_FOUND" ]]; then
            LOG_GROUP_NAME=$(echo "$LOG_GROUP_EXISTS" | jq -r '.logGroups[0].logGroupName')
            if [[ -n "$LOG_GROUP_NAME" && "$LOG_GROUP_NAME" != "null" ]]; then
              echo "Importing existing CloudWatch Log Group: $LOG_GROUP_NAME"
              terraform import aws_cloudwatch_log_group.main "$LOG_GROUP_NAME" || echo "Import failed, but continuing"
            fi
          fi
          
          # Apply ECS cluster and CloudWatch Log Group
          echo "Applying ECS cluster and CloudWatch Log Group..."
          terraform apply -auto-approve -target=aws_ecs_cluster.main -target=aws_cloudwatch_log_group.main || echo "Some ECS resources already exist, continuing with other resources"
          
          # Apply ECS task definition
          echo "Applying ECS task definition..."
          terraform apply -auto-approve -target=aws_ecs_task_definition.main
          
          # Apply ECS service
          echo "Applying ECS service..."
          terraform apply -auto-approve -target=aws_ecs_service.main || true
          
          echo "Getting latest task definition ARN..."
          LATEST_TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition pricing-agent-${ENVIRONMENT} --query "taskDefinition.taskDefinitionArn" --output text 2>/dev/null)
          
          # Check if service exists
          SERVICE_EXISTS=$(aws ecs describe-services --cluster pricing-agent-${ENVIRONMENT}-cluster --services pricing-agent-${ENVIRONMENT}-service --query "services[0]" 2>/dev/null || echo "NOT_FOUND")
          if [[ "$SERVICE_EXISTS" != "NOT_FOUND" && "$SERVICE_EXISTS" != "null" ]]; then
            echo "Importing ECS service using correct format: pricing-agent-${ENVIRONMENT}-cluster/pricing-agent-${ENVIRONMENT}-service"
            terraform import aws_ecs_service.main pricing-agent-${ENVIRONMENT}-cluster/pricing-agent-${ENVIRONMENT}-service || echo "Import failed"
          fi
          
          # Apply the ECS service
          terraform apply -auto-approve -target=aws_ecs_service.main || {
            echo "Failed to apply ECS service through Terraform. Trying AWS CLI..."
            
            # Get the latest task definition ARN
            LATEST_TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition pricing-agent-${ENVIRONMENT} --query "taskDefinition.taskDefinitionArn" --output text)
            
            # Get security group ID
            ECS_SG=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=pricing-agent-${ENVIRONMENT}-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
            
            # Get private subnet IDs - these should be used with NAT Gateways for proper internet access
            echo "Looking for private subnets in the same VPC as the ALB..."
            
            # First, get the VPC ID from the ALB
            ALB_VPC_ID=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb --query "LoadBalancers[0].VpcId" --output text 2>/dev/null)
            echo "ALB VPC ID: $ALB_VPC_ID"
            
            # Then find private subnets in that VPC
            PRIVATE_SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            
            # If no private subnets found, try to find any subnets with the right name pattern
            if [[ -z "$PRIVATE_SUBNET_IDS" || "$PRIVATE_SUBNET_IDS" == "None" ]]; then
              echo "No private subnets found in ALB VPC. Trying general search..."
              PRIVATE_SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            fi
            
            # Final fallback to public subnets if needed
            if [[ -z "$PRIVATE_SUBNET_IDS" || "$PRIVATE_SUBNET_IDS" == "None" ]]; then
              echo "WARNING: No private subnets found. Falling back to public subnets. This is not recommended for production."
              PRIVATE_SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-public-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            fi
            
            echo "Using subnet IDs: $PRIVATE_SUBNET_IDS"
            
            # Get target group ARN
            TG_ARN=$(aws elbv2 describe-target-groups --names pricing-agent-${ENVIRONMENT}-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null)
            
            if [[ -n "$LATEST_TASK_DEF_ARN" && -n "$ECS_SG" && -n "$PRIVATE_SUBNET_IDS" && -n "$TG_ARN" ]]; then
              echo "Creating ECS service using AWS CLI..."
              aws ecs create-service \
                --cluster pricing-agent-${ENVIRONMENT}-cluster \
                --service-name pricing-agent-${ENVIRONMENT}-service \
                --task-definition $LATEST_TASK_DEF_ARN \
                --desired-count 1 \
                --launch-type FARGATE \
                --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET_IDS],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" \
                --load-balancers "targetGroupArn=$TG_ARN,containerName=app,containerPort=8501" || {
                  echo "Failed to create service using AWS CLI. Checking if service already exists..."
                  aws ecs update-service \
                    --cluster pricing-agent-${ENVIRONMENT}-cluster \
                    --service pricing-agent-${ENVIRONMENT}-service \
                    --task-definition $LATEST_TASK_DEF_ARN \
                    --force-new-deployment || echo "Failed to update service"
                }
            else
              echo "Missing required parameters for ECS service creation:"
              echo "Task Definition ARN: $LATEST_TASK_DEF_ARN"
              echo "ECS Security Group: $ECS_SG"
              echo "Subnet IDs: $SUBNET_IDS"
              echo "Target Group ARN: $TG_ARN"
            fi
          }
          
          echo "\n✅ Infrastructure deployment complete!\n"
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: ${{ env.MODEL }}
      
      - name: Debug and Create ECS Service
        run: |
          echo "\n🚀 Debugging ECS service...\n"
          
          # Get the ECS cluster and service names
          CLUSTER_NAME="pricing-agent-${ENVIRONMENT}-cluster"
          SERVICE_NAME="pricing-agent-${ENVIRONMENT}-service"
          
          # Check if the cluster exists
          echo "Checking if ECS cluster exists..."
          aws ecs describe-clusters --clusters $CLUSTER_NAME --query "clusters[?status=='ACTIVE']" --output text
          
          # Check if the task definition exists
          echo "\nChecking task definition..."
          TASK_DEF="pricing-agent-${ENVIRONMENT}"
          aws ecs describe-task-definition --task-definition $TASK_DEF || echo "Task definition not found"
          
          # Check if the service exists
          echo "\nChecking if ECS service exists..."
          aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME || echo "Service not found"
          
          # Check security groups and subnets
          echo "\nChecking security groups..."
          SG_NAME="pricing-agent-${ENVIRONMENT}-ecs-sg"
          aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" || echo "Security group not found"
          
          echo "\nChecking subnets..."
          aws ec2 describe-subnets --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" || echo "Subnets not found"
          
          # Try to create the service if it doesn't exist
          echo "\nAttempting to create ECS service..."
          cd infrastructure
          
          # Apply just the ECS service
          echo "Applying ECS service resource..."
          terraform apply -auto-approve -target=aws_ecs_service.main || {
            echo "\n⚠️ Failed to create ECS service through Terraform.\n"
            
            # Get task definition ARN
            TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition $TASK_DEF --query "taskDefinition.taskDefinitionArn" --output text)
            
            # Get security group ID
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" --query "SecurityGroups[0].GroupId" --output text)
            
            # Get subnet IDs using the same strategy as above
            # First, get the VPC ID from the ALB
            ALB_VPC_ID=$(aws elbv2 describe-load-balancers --names pricing-agent-${ENVIRONMENT}-alb --query "LoadBalancers[0].VpcId" --output text 2>/dev/null)
            echo "ALB VPC ID: $ALB_VPC_ID"
            
            # Then find private subnets in that VPC
            SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            
            # If no private subnets found, try to find any subnets with the right name pattern
            if [[ -z "$SUBNET_IDS" || "$SUBNET_IDS" == "None" ]]; then
              echo "No private subnets found in ALB VPC. Trying general search..."
              SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-private-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            fi
            
            # Final fallback to public subnets if needed
            if [[ -z "$SUBNET_IDS" || "$SUBNET_IDS" == "None" ]]; then
              echo "WARNING: No private subnets found. Falling back to public subnets. This is not recommended for production."
              SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$ALB_VPC_ID" "Name=tag:Name,Values=pricing-agent-${ENVIRONMENT}-public-*" --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
            fi
            
            echo "Using subnet IDs: $SUBNET_IDS"
            
            # Get target group ARN
            TG_NAME="pricing-agent-${ENVIRONMENT}-tg"
            TG_ARN=$(aws elbv2 describe-target-groups --names $TG_NAME --query "TargetGroups[0].TargetGroupArn" --output text)
            
            echo "Creating ECS service using AWS CLI..."
            aws ecs create-service \
              --cluster $CLUSTER_NAME \
              --service-name $SERVICE_NAME \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=app,containerPort=8501" || echo "Failed to create service using AWS CLI"
          }
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
      
      - name: Output Deployment Information
        run: |
          # Get ALB DNS from Terraform
          cd infrastructure
          ALB_DNS=$(terraform output alb_dns_name 2>/dev/null | tr -d '"' || echo 'Not available')
          
          # Simple output with just the essential information
          echo "\n🎉 PRICING AGENT DEPLOYMENT COMPLETE 🎉\n"
          
          if [[ "$ALB_DNS" != "Not available" ]]; then
            echo "APPLICATION URL: http://$ALB_DNS"
          else
            echo "APPLICATION URL: Check AWS Console for ALB DNS name"
          fi
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ env.AWS_REGION }}
