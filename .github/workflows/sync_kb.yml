name: Sync Knowledge Base

on:
  push:
    branches: [main]
    paths:
      - 'policies/**'  # Only trigger on changes to policies
  workflow_dispatch:  # Allow manual triggering

env:
  ENVIRONMENT: dev  # Default environment, can be overridden in repository secrets

jobs:
  sync-kb:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Get S3 Bucket for Terraform State
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          
          # Initialize with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent-${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3
      
      - name: Sync policies to S3
        run: |
          # Get policy bucket name from SSM
          POLICY_BUCKET=$(aws ssm get-parameter --name "/pricing-agent-${{ env.ENVIRONMENT }}/policy-bucket-name" --query "Parameter.Value" --output text)
          
          # Sync policies to S3
          aws s3 sync policies/ s3://$POLICY_BUCKET/ --delete
          
          echo "Policies synced to S3 bucket: $POLICY_BUCKET"
      
      - name: Run knowledge base sync
        run: |
          # Install script dependencies
          pip install boto3
          
          # Make script executable
          chmod +x scripts/sync_kb.py
          
          # Run sync script
          python scripts/sync_kb.py --wait
        env:
          NAME_PREFIX: pricing-agent-${{ env.ENVIRONMENT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
