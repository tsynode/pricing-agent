name: Destroy Pricing Agent Infrastructure

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      environment:
        description: 'Environment to destroy (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}  # Use input or default to dev

jobs:
  destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Get S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init and Workspace Setup
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          echo "Using environment: ${ENVIRONMENT}"
          
          # Initialize Terraform with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
            
          # Select workspace based on environment
          terraform workspace select ${ENVIRONMENT} || echo "Workspace ${ENVIRONMENT} not found, nothing to destroy"
      

      
      - name: Terraform Destroy
        working-directory: ./infrastructure
        run: |
          echo "Destroying all resources..."
          terraform destroy -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: "anthropic.claude-opus-4-20250514-v1:0"
          TF_VAR_domain_name: ""
          TF_VAR_enable_https: "true"
