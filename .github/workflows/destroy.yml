name: Destroy Pricing Agent Infrastructure

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      environment:
        description: 'Environment to destroy (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}  # Use input or default to dev

jobs:
  destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Get S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init with Legacy State Path
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          echo "Using environment: ${ENVIRONMENT}"
          
          # First, initialize with the old state path to access existing resources
          echo "\n🔄 Initializing with legacy state path to access existing resources...\n"
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=terraform/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
          
          # Check if there are any resources in the old state
          RESOURCE_COUNT=$(terraform state list | wc -l)
          
          if [ "$RESOURCE_COUNT" -gt 0 ]; then
            echo "\n✅ Found $RESOURCE_COUNT resources in the legacy state path.\n"
            echo "Proceeding with destroy using the legacy state path."
          else
            echo "\n⚠️ No resources found in the legacy state path.\n"
            
            # Try initializing with the new workspace approach
            echo "\n🔄 Trying new workspace approach...\n"
            terraform init -reconfigure \
              -backend-config="bucket=$TF_BUCKET_NAME" \
              -backend-config="key=terraform.tfstate" \
              -backend-config="region=${{ secrets.AWS_REGION }}" \
              -backend-config="encrypt=true"
              
            # Select or create workspace based on environment
            terraform workspace select ${ENVIRONMENT} || terraform workspace new ${ENVIRONMENT}
            
            # Verify the workspace
            echo "Active Terraform workspace: $(terraform workspace show)"
            
            # Check if there are any resources in the workspace state
            WORKSPACE_RESOURCE_COUNT=$(terraform state list | wc -l)
            
            if [ "$WORKSPACE_RESOURCE_COUNT" -gt 0 ]; then
              echo "\n✅ Found $WORKSPACE_RESOURCE_COUNT resources in the workspace state.\n"
            else
              echo "\n⚠️ No resources found in either state location. Nothing to destroy.\n"
            fi
          fi
      

      
      - name: Terraform Destroy
        working-directory: ./infrastructure
        run: |
          echo "\n🗑️ Destroying all resources...\n"
          
          # Check if we're using the legacy state path or workspace
          if terraform state list | grep -q "aws_vpc.main"; then
            echo "Using current state configuration for destroy"
          else
            # If no resources found, we might need to reinitialize with the legacy state path
            echo "\n🔄 No resources found in current state, checking legacy state path...\n"
            
            terraform init -reconfigure \
              -backend-config="bucket=$TF_BUCKET_NAME" \
              -backend-config="key=terraform/${ENVIRONMENT}/terraform.tfstate" \
              -backend-config="region=${{ secrets.AWS_REGION }}" \
              -backend-config="encrypt=true"
              
            if ! terraform state list | grep -q "aws_vpc.main"; then
              echo "\n⚠️ No resources found in either state location. Nothing to destroy.\n"
              exit 0
            fi
          fi
          
          # Destroy all resources
          echo "\n💥 Executing terraform destroy...\n"
          terraform destroy -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
          TF_VAR_model_id: "anthropic.claude-opus-4-20250514-v1:0"
          TF_VAR_domain_name: ""
          TF_VAR_enable_https: "true"
