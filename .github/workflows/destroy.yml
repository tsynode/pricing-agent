name: Destroy Pricing Agent Infrastructure

on:
  workflow_dispatch:  # Manual trigger only

env:
  ENVIRONMENT: dev  # Default environment, can be overridden in repository secrets

jobs:
  destroy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: "Get S3 Bucket for Terraform State"
        run: |
          # Create a unique bucket name with GitHub repository owner
          BUCKET_NAME="pricing-agent-tf-state-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
          
          # Save the bucket name for Terraform Init step
          echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          
          # Print the bucket name for debugging
          echo "Using S3 bucket: $BUCKET_NAME"
      
      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          # Print environment variables for debugging
          echo "Using S3 bucket: $TF_BUCKET_NAME"
          echo "Using AWS region: ${{ secrets.AWS_REGION }}"
          
          # Initialize with S3 backend
          terraform init \
            -backend-config="bucket=$TF_BUCKET_NAME" \
            -backend-config="key=pricing-agent-${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
      
      - name: Import Resources Before Destroy
        working-directory: ./infrastructure
        run: |
          echo "Importing existing resources before destroying..."
          
          # Import SSM parameters
          terraform import aws_ssm_parameter.kb_id /pricing-agent-dev/knowledge-base-id || true
          terraform import aws_ssm_parameter.session_bucket_name /pricing-agent-dev/session-bucket-name || true
          terraform import aws_ssm_parameter.policy_bucket_name /pricing-agent-dev/policy-bucket-name || true
          
          # Import DynamoDB tables
          terraform import aws_dynamodb_table.pricing pricing-agent-dev-pricing-rules || true
          terraform import aws_dynamodb_table.inventory pricing-agent-dev-inventory || true
          
          # Import IAM policies
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform import aws_iam_policy.ecs_task_policy arn:aws:iam::$ACCOUNT_ID:policy/pricing-agent-dev-ecs-task-policy || true
          terraform import aws_iam_policy.ecs_execution_policy arn:aws:iam::$ACCOUNT_ID:policy/pricing-agent-dev-ecs-execution-policy || true
          
          # Import S3 buckets
          terraform import aws_s3_bucket.policy pricing-agent-dev-policy || true
          terraform import aws_s3_bucket.session pricing-agent-dev-session || true
          
          echo "Import completed. Ready to destroy resources."
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
      
      - name: Terraform Destroy
        working-directory: ./infrastructure
        run: |
          # First destroy VPC-related resources to free up limits
          echo "Destroying VPC-related resources first..."
          terraform destroy -auto-approve -target=aws_vpc.main -target=aws_eip.nat || true
          
          # Then destroy the rest
          echo "Destroying remaining resources..."
          terraform destroy -auto-approve
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_project_name: pricing-agent
